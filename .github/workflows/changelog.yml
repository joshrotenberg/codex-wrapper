name: Changelog

# Preview-only: release-plz writes CHANGELOG.md using the same cliff.toml,
# so grouping-rule changes can be reviewed without rewriting release history.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - cliff.toml
      - release-plz.toml
      - .github/workflows/changelog.yml

permissions:
  contents: read

jobs:
  preview:
    name: Changelog preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Render unreleased changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose --unreleased
        env:
          OUTPUT: changelog-preview.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Publish preview to job summary
        run: cat changelog-preview.md >> "$GITHUB_STEP_SUMMARY"

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta]
        exclude:
          - os: macos-latest
            rust: beta
          - os: windows-latest
            rust: beta
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          shared-key: "${{ matrix.os }}-${{ matrix.rust }}"

      - name: Check formatting
        if: matrix.rust == 'stable' && matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: Clippy
        if: matrix.rust == 'stable'
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --all-features

      - name: Build without default features
        run: cargo build --no-default-features

      - name: Unit tests
        run: cargo test --lib --all-features

      - name: Doc tests
        run: cargo test --doc --all-features

  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  msrv:
    name: MSRV check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90.0"

      - uses: swatinem/rust-cache@v2
        with:
          shared-key: "msrv"

      - name: Check MSRV
        run: cargo check --all-features

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          shared-key: "docs"

      - name: Build docs
        run: cargo doc --no-deps --all-features


  contract:
    name: CLI contract (codex ${{ matrix.codex }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The CLI version this wrapper is tested against. Bump deliberately,
        # with the drift the bump surfaces fixed in the same change.
        codex: ["0.145.0"]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          shared-key: "contract"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install codex CLI
        run: npm install -g @openai/codex@${{ matrix.codex }}

      - name: Record CLI version
        run: codex --version

      # No auth is configured here, and none is needed: every check reads
      # `--help` or fails during config load, before the CLI contacts anything.
      - name: Check emitted flags against the CLI
        run: cargo test --test contract --all-features -- --ignored

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta]
        exclude:
          - os: macos-latest
            rust: beta
          - os: windows-latest
            rust: beta
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          shared-key: "${{ matrix.os }}-${{ matrix.rust }}"

      - name: Check formatting
        if: matrix.rust == 'stable' && matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: Clippy
        if: matrix.rust == 'stable'
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --all-features

      - name: Build without default features
        run: cargo build --no-default-features

      # `config` is off by default, so --all-features is the only job that
      # compiles it. This checks it also stands alone, without `json`.
      - name: Build the config feature alone
        run: cargo build --no-default-features --features config

      # The lib builds and tests without default features, and every target
      # builds with all of them, but nothing checked the intersection: a test
      # naming a json-only API compiles under --all-features and breaks here.
      # Clippy rather than check, so an unused import that only appears in
      # this configuration fails too.
      - name: Lint every target without default features
        if: matrix.rust == 'stable'
        run: cargo clippy --all-targets --no-default-features -- -D warnings

      - name: Unit tests
        run: cargo test --lib --all-features

      # Building without default features is not enough: the test target has
      # its own feature-gating, and a test referring to a json-only type
      # compiles fine under --all-features while breaking this build.
      - name: Unit tests without default features
        run: cargo test --lib --no-default-features

      # Runs nothing today: every test under tests/ is #[ignore]d and needs a
      # real authenticated codex, which the contract job supplies with
      # --ignored. This step compiles the directory and gives a non-ignored
      # test somewhere to run, so one is not added to a suite CI never invokes.
      - name: Integration test harness
        run: cargo test --test '*' --all-features

      - name: Doc tests
        run: cargo test --doc --all-features

  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  msrv:
    name: MSRV check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90.0"

      - uses: swatinem/rust-cache@v2
        with:
          shared-key: "msrv"

      - name: Check MSRV
        run: cargo check --all-features

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          shared-key: "docs"

      - name: Build docs
        run: cargo doc --no-deps --all-features


  contract:
    name: CLI contract (codex ${{ matrix.codex }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The CLI versions this wrapper is tested against. These are the two
        # ends of the range declared by TESTED_CLI_VERSION_MIN and
        # TESTED_CLI_VERSION_MAX in src/version.rs, and a test asserts the two
        # stay in step. Bump deliberately, fixing any drift in the same change.
        codex: ["0.145.0", "0.147.0"]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          shared-key: "contract"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install codex CLI
        run: npm install -g @openai/codex@${{ matrix.codex }}

      - name: Record CLI version
        run: codex --version

      # No auth is configured here, and none is needed: every check reads
      # `--help` or fails during config load, before the CLI contacts anything.
      #
      # CODEX_WRAPPER_ALLOW_DANGEROUS unlocks the two bypass flags gated in
      # #86, so they stay covered by the contract check. Nothing here runs a
      # model, so the flags are only ever compared against `--help`.
      - name: Check emitted flags against the CLI
        env:
          CODEX_WRAPPER_ALLOW_DANGEROUS: "1"
        run: cargo test --test contract --all-features -- --ignored
